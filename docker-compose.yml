services:
  api:
    build: .
    image: quran-llm:latest
    container_name: quran-llm-api
    command: ["uvicorn", "quran_api:app", "--host", "0.0.0.0", "--port", "${PORT:-8006}"]
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8006}
    ports:
      - "${PORT:-8006}:${PORT:-8006}"
    volumes:
      - ./vector_store:/app/vector_store
      - ./logs:/app/logs
    restart: unless-stopped

  ui:
    build: .
    image: quran-llm:latest
    container_name: quran-llm-ui
    command: ["python", "app.py"]
    env_file:
      - .env
    environment:
      - GRADIO_PORT=${GRADIO_PORT:-7860}
    ports:
      - "${GRADIO_PORT:-7860}:${GRADIO_PORT:-7860}"
    volumes:
      - ./vector_store:/app/vector_store
      - ./logs:/app/logs
    restart: unless-stopped
